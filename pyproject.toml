[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tumblr-export"
version = "0.1.0"
description = "Export posts and media from any public Tumblr blog to Markdown and JSON using Tumblr API v2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tumblr-export = "tumblr_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

